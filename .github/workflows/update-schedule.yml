name: Update schedule
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: schedule-master
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fetch and update schedule
        run: python3 scripts/sync_schedule.py
      - name: Commit schedule changes
        id: commit
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Обновить расписание команды"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start site build and deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref master
