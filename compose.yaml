name: arenaplayteam
services:
  site:
    image: lobanovsky/arenaplayru:${TAG:?Set TAG in .env}
    container_name: arenaplayteam-site
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: housekpr-network
      traefik.http.routers.arenaplayteam.rule: Host(`arenaplayteam.ru`) || Host(`www.arenaplayteam.ru`)
      traefik.http.routers.arenaplayteam.entrypoints: https
      traefik.http.routers.arenaplayteam.tls.certresolver: letsEncrypt
      traefik.http.services.arenaplayteam.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
    name: housekpr-network
